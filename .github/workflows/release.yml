name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    env:
      APPLE_CERTIFICATE_P12_BASE64: ${{ secrets.APPLE_CERTIFICATE_P12_BASE64 }}
      APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
    steps:
      - uses: actions/checkout@v7
      - name: Privacy checks
        run: Scripts/check_repository.sh
      - name: Test
        run: swift test
      - name: Detect Apple signing configuration
        id: signing
        shell: bash
        run: |
          required=(
            APPLE_CERTIFICATE_P12_BASE64
            APPLE_CERTIFICATE_PASSWORD
            APPLE_SIGNING_IDENTITY
            APPLE_ID
            APPLE_TEAM_ID
            APPLE_APP_SPECIFIC_PASSWORD
          )
          enabled=true
          for name in "${required[@]}"; do
            if [[ -z "${!name}" ]]; then
              enabled=false
            fi
          done
          echo "enabled=$enabled" >> "$GITHUB_OUTPUT"
          if [[ "$enabled" == true ]]; then
            echo "A Developer ID-signed and notarized release will be created."
          else
            echo "Apple signing secrets are incomplete; an ad-hoc-signed release will be created."
          fi
      - name: Import Developer ID certificate
        if: steps.signing.outputs.enabled == 'true'
        shell: bash
        run: |
          keychain="$RUNNER_TEMP/codex-usage-bar.keychain-db"
          certificate="$RUNNER_TEMP/developer-id.p12"
          printf '%s' "$APPLE_CERTIFICATE_P12_BASE64" | openssl base64 -d -A -out "$certificate"
          security create-keychain -p codex-usage-bar-build "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p codex-usage-bar-build "$keychain"
          security import "$certificate" -k "$keychain" -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k codex-usage-bar-build "$keychain"
          security list-keychains -d user -s "$keychain"
      - name: Build application
        shell: bash
        run: |
          if [[ "${{ steps.signing.outputs.enabled }}" == true ]]; then
            CODEX_USAGE_BAR_VERSION="${GITHUB_REF_NAME#v}" \
            CODEX_USAGE_BAR_SIGN_IDENTITY="$APPLE_SIGNING_IDENTITY" \
            Scripts/package_app.sh
          else
            CODEX_USAGE_BAR_VERSION="${GITHUB_REF_NAME#v}" Scripts/package_app.sh
          fi
      - name: Notarize and staple
        if: steps.signing.outputs.enabled == 'true'
        run: |
          CODEX_USAGE_BAR_SIGN_IDENTITY="$APPLE_SIGNING_IDENTITY" \
          Scripts/notarize_app.sh \
            "dist/Codex Usage Bar.app" \
            "dist/Codex-Usage-Bar-${GITHUB_REF_NAME#v}.zip"
      - name: Archive ad-hoc build
        if: steps.signing.outputs.enabled != 'true'
        shell: bash
        run: |
          archive="dist/Codex-Usage-Bar-${GITHUB_REF_NAME#v}-ad-hoc.zip"
          ditto -c -k --sequesterRsrc --keepParent "dist/Codex Usage Bar.app" "$archive"
          shasum -a 256 "$archive" > "$archive.sha256"
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ "${{ steps.signing.outputs.enabled }}" == true ]]; then
            archive="dist/Codex-Usage-Bar-${GITHUB_REF_NAME#v}.zip"
            release_note="Developer ID-signed, hardened, notarized, and stapled macOS build."
          else
            archive="dist/Codex-Usage-Bar-${GITHUB_REF_NAME#v}-ad-hoc.zip"
            release_note="Ad-hoc-signed macOS build. On first launch, Control-click the app and choose Open if Gatekeeper blocks it."
          fi
          gh release create "$GITHUB_REF_NAME" \
            "$archive" \
            "$archive.sha256" \
            --generate-notes \
            --notes "$release_note" \
            --verify-tag
      - name: Delete temporary keychain
        if: always() && steps.signing.outputs.enabled == 'true'
        run: security delete-keychain "$RUNNER_TEMP/codex-usage-bar.keychain-db" || true
